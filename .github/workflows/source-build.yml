name: Source build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install source preparation tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Check the Gradle plugin
        run: ./gradlew -p gradle/plugins/zoot check --console=plain

  guest-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Install WASI SDK 33
        run: |
          curl --fail --location --retry 3 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz \
            --output "$RUNNER_TEMP/wasi-sdk.tar.gz"
          printf '%s  %s\n' \
            0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce \
            "$RUNNER_TEMP/wasi-sdk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasi-sdk.tar.gz" -C "$RUNNER_TEMP"
          echo "WASI_CLANG=$RUNNER_TEMP/wasi-sdk-33.0-x86_64-linux/bin/clang" >> "$GITHUB_ENV"
      - name: Build from fresh upstream downloads without a ROM
        run: ./gradlew buildGuest --console=plain
      - name: Verify offline reuse
        run: ./gradlew buildGuest --offline --console=plain
      - name: Test the guest adapters and save compatibility
        run: bash tools/test-guest.sh
